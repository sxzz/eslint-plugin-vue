name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    if: github.repository == 'sxzz/eslint-plugin-vue'
    uses: sxzz/workflows/.github/workflows/release.yml@main
    with:
      build: pnpm run build
      publish: true
      stage: true
    permissions:
      contents: write
      id-token: write
